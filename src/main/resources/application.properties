# ==========================================
# Application
# ==========================================
spring.application.name=api-agroconecta
server.port=${PORT:8080}

# ==========================================
# Database (variables de entorno; nunca escribir credenciales aquí)
#   DB_URL       ej: jdbc:postgresql://<host>:5432/postgres?sslmode=require
#   DB_USERNAME
#   DB_PASSWORD
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agroconecta}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool pequeño: el plan gratis de Supabase limita las conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# JWT (JWT_SECRET: texto largo y aleatorio, mínimo 32 caracteres)
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# CORS (orígenes permitidos, separados por coma)
# ==========================================
app.cors.origins=${CORS_ORIGINS:https://cesarespa.github.io,http://localhost:5520,http://127.0.0.1:5520}

# ==========================================
# Almacenamiento de imágenes
#   Supabase Storage: SUPABASE_URL, SUPABASE_SERVICE_KEY, SUPABASE_BUCKET
#   Google Cloud Storage (opcional): GCP_CREDENTIALS_JSON, GCP_BUCKET
# ==========================================
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.key=${SUPABASE_SERVICE_KEY:}
app.storage.supabase.bucket=${SUPABASE_BUCKET:productos}
gcp.bucket.name=${GCP_BUCKET:bucket-images-products-agroconecta-v2}
gcp.credentials.json=${GCP_CREDENTIALS_JSON:}

# ==========================================
# Datos iniciales (solo se crean si la base está vacía)
#   ADMIN_EMAIL / ADMIN_PASSWORD: cuenta administradora inicial
#   DEMO_CLIENT_EMAIL / DEMO_CLIENT_PASSWORD: cuenta cliente de demostración (opcional)
#   SEED_IMAGE_BASE: URL base de las imágenes de los productos semilla
# ==========================================
app.seed.admin.email=${ADMIN_EMAIL:}
app.seed.admin.password=${ADMIN_PASSWORD:}
# true: en cada arranque la contraseña del admin se iguala a ADMIN_PASSWORD
app.seed.admin.sync-password=${ADMIN_SYNC_PASSWORD:false}
app.seed.client.email=${DEMO_CLIENT_EMAIL:}
app.seed.client.password=${DEMO_CLIENT_PASSWORD:}
app.seed.image-base=${SEED_IMAGE_BASE:https://cesarespa.github.io/AgroConecta/assets/imgs/}
